# HTTP-only vhost used once, before the certificate exists.
# Copy to /etc/nginx/sites-available/ink.conf, enable it, reload nginx, then run
# certbot. Replace it with nginx-ink.conf after the certificate is issued.

server {
    listen 80;
    listen [::]:80;
    server_name 886945.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
